<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Produtividade Agrícola</title>
    
    <!-- Chart.js para os gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- SheetJS (xlsx) para ler ficheiros Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary: #2c3e50;
            --success: #27ae60;
            --warning: #d35400;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            line-height: 1.25;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h1 {
            margin: 0;
            color: var(--primary);
            font-size: 1.5rem;
        }

        #loading {
            text-align: center;
            font-size: 1.2em;
            color: var(--warning);
            font-weight: bold;
            padding: 40px;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .dashboard-content {
            display: none; /* Só aparece depois de carregar os dados */
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #555;
        }

        .filter-group select, .filter-group input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-width: 180px;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 0.95rem;
            color: #777;
        }

        .card .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
        }

        .grid-charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 900px) {
            .grid-charts {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .chart-card h2 {
            font-size: 1.1rem;
            margin-top: 0;
            color: var(--primary);
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Dashboard de Produtividade Agrícola</h1>
            <span id="status-conexao" style="font-size: 0.85rem; color: #27ae60;">● Pronto</span>
        </header>
        
        <div id="loading">A sincronizar dados do Excel no GitHub...</div>

        <div id="dashboard" class="dashboard-content">
            <!-- Filtros -->
            <div class="filters">
                <div class="filter-group">
                    <label for="filtroLocal">Localização / Propriedade</label>
                    <select id="filtroLocal" onchange="atualizarDashboard()">
                        <option value="TODOS">Todas as Localizações</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filtroAno">Ano / Período</label>
                    <select id="filtroAno" onchange="atualizarDashboard()">
                        <option value="TODOS">Todos</option>
                    </select>
                </div>
            </div>

            <!-- Cartões de Resumo -->
            <div class="grid-cards">
                <div class="card">
                    <h3>Média Geral (pl/h)</h3>
                    <div class="value" id="kpi-plh">0.00</div>
                </div>
                <div class="card">
                    <h3>Média Geral (kg/h)</h3>
                    <div class="value" id="kpi-kgh">0.00</div>
                </div>
                <div class="card">
                    <h3>Total (h/ha/semana)</h3>
                    <div class="value" id="kpi-hha">0.00</div>
                </div>
            </div>

            <!-- Gráficos -->
            <div class="grid-charts">
                <div class="chart-card">
                    <h2>Evolução da Produtividade (kg/h)</h2>
                    <canvas id="chartKgH"></canvas>
                </div>
                <div class="chart-card">
                    <h2>Rendimento de Mão de Obra (pl/h)</h2>
                    <canvas id="chartPlH"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // COLE AQUI O SEU LINK RAW DO GITHUB DO FICHEIRO EXCEL (.xlsx)
        const excelUrl = 'https://raw.githubusercontent.com/luisverissimo/controlofinanceiro/main/Movimentos.xlsx';

        let dadosGlobais = [];
        let chartKgHInstance = null;
        let chartPlHInstance = null;

        // 1. Carregar o Excel do GitHub ao iniciar a página
        async function carregarExcelDoGitHub() {
            try {
                const response = await fetch(excelUrl);
                if (!response.ok) throw new Error('Falha ao descarregar o ficheiro Excel.');
                
                const buffer = await response.arrayBuffer();
                const workbook = XLSX.read(buffer, { type: 'array' });
                
                // Lê a primeira folha do Excel
                const nomeFolha = workbook.SheetNames[0];
                const folha = workbook.Sheets[nomeFolha];
                
                // Converte para JSON
                dadosGlobais = XLSX.utils.sheet_to_json(folha);

                if (dadosGlobais.length === 0) {
                    alert('O ficheiro Excel está vazio ou não foi lido corretamente.');
                    return;
                }

                // Esconde o aviso de loading e mostra o dashboard
                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';

                inicializarFiltros();
                atualizarDashboard();

            } catch (error) {
                console.error(error);
                document.getElementById('loading').innerText = 'Erro ao carregar o Excel. Verifique a consola e o link Raw do GitHub.';
            }
        }

        // 2. Preencher as opções dos filtros dinamicamente com base nas colunas do Excel
        function inicializarFiltros() {
            const locaisSet = new Set();
            const anosSet = new Set();

            dadosGlobais.forEach(row => {
                if (row.Localizacao) locaisSet.add(row.Localizacao);
                if (row.Ano) anosSet.add(row.Ano);
            });

            const selectLocal = document.getElementById('filtroLocal');
            locaisSet.forEach(local => {
                const opt = document.createElement('option');
                opt.value = local;
                opt.textContent = local;
                selectLocal.appendChild(opt);
            });

            const selectAno = document.getElementById('filtroAno');
            anosSet.forEach(ano => {
                const opt = document.createElement('option');
                opt.value = ano;
                opt.textContent = ano;
                selectAno.appendChild(opt);
            });
        }

        // 3. Atualizar cálculos e gráficos conforme os filtros selecionados
        function atualizarDashboard() {
            const localSelecionado = document.getElementById('filtroLocal').value;
            const anoSelecionado = document.getElementById('filtroAno').value;

            // Filtrar dados
            const dadosFiltrados = dadosGlobais.filter(row => {
                const matchLocal = (localSelecionado === 'TODOS' || row.Localizacao === localSelecionado);
                const matchAno = (anoSelecionado === 'TODOS' || String(row.Ano) === String(anoSelecionado));
                return matchLocal && matchAno;
            });

            // Calcular KPIs (médias)
            let somaPlH = 0, somaKgH = 0, somaHHa = 0;
            const totalLinhas = dadosFiltrados.length || 1;

            dadosFiltrados.forEach(row => {
                somaPlH += Number(row.PlH || row['pl/h'] || 0);
                somaKgH += Number(row.KgH || row['kg/h'] || 0);
                somaHHa += Number(row.HHa || row['h/ha/semana'] || 0);
            });

            document.getElementById('kpi-plh').textContent = (somaPlH / totalLinhas).toFixed(2);
            document.getElementById('kpi-kgh').textContent = (somaKgH / totalLinhas).toFixed(2);
            document.getElementById('kpi-hha').textContent = (somaHHa / totalLinhas).toFixed(2);

            // Preparar dados para os gráficos
            const labels = dadosFiltrados.map(row => row.Data || row.Semana || 'Registo');
            const valoresKgH = dadosFiltrados.map(row => Number(row.KgH || row['kg/h'] || 0));
            const valoresPlH = dadosFiltrados.map(row => Number(row.PlH || row['pl/h'] || 0));

            desenharGraficos(labels, valoresKgH, valoresPlH);
        }

        // 4. Renderizar/Atualizar Gráficos Chart.js
        function desenharGraficos(labels, valoresKgH, valoresPlH) {
            // Gráfico Kg/H
            const ctxKg = document.getElementById('chartKgH').getContext('2d');
            if (chartKgHInstance) chartKgHInstance.destroy();
            chartKgHInstance = new Chart(ctxKg, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'kg/h',
                        data: valoresKgH,
                        borderColor: '#27ae60',
                        backgroundColor: 'rgba(39, 174, 96, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.1
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });

            // Gráfico Pl/H
            const ctxPl = document.getElementById('chartPlH').getContext('2d');
            if (chartPlHInstance) chartPlHInstance.destroy();
            chartPlHInstance = new Chart(ctxPl, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'pl/h',
                        data: valoresPlH,
                        backgroundColor: '#2c3e50',
                        borderWidth: 1
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });
        }

        // Executar carregamento ao abrir
        carregarExcelDoGitHub();
    </script>
</body>
</html>
